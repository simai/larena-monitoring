package: larena/monitoring
title: Larena Monitoring
status: coding_started
cluster: ai-mcp-automation
batch: monitoring-metrics
features:
  - monitoring.admin_dashboard
  - monitoring.health_checks
  - monitoring.incidents
  - monitoring.metrics
  - monitoring.probe_registry
  - monitoring.retention_aggregation_policy
runtime:
  php: "^8.3"
  laravel: "^13.0"
evidence:
  path: docs/project-management/evidence/monitoring-metrics/
delivery:
  publisher: simai
  distribution: open
  license: Apache-2.0
  requires:
    larena: dev-main
    packages: {}
  capabilities:
    - larena.capability.monitoring.base
  requires_capabilities: []
  data_on_removal: kept_read_only
  migrations_reversible: true
